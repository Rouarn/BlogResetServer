# =============================================================================
# Docker Compose 配置文件
#
# 用于编排 NestJS 应用的完整技术栈，包括：
# - NestJS 应用服务器
# - 独立健康检查服务
# - MySQL 数据库
# - Redis 缓存
# - Nginx 反向代理
#
# 使用方法：
# - 启动所有服务：docker-compose up -d
# - 查看日志：docker-compose logs -f [service_name]
# - 停止服务：docker-compose down
# - 重建服务：docker-compose up -d --build
#
# 环境变量：
# 需要在 .env 文件中设置：
# - DATABASE_PASSWORD: 数据库密码
# - NEST_JWT_SECRET: JWT 密钥
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # NestJS 主应用服务
  # 运行编译后的 NestJS 应用
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../../ # 构建上下文：项目根目录
      dockerfile: deploy/docker/Dockerfile # Dockerfile 路径
    container_name: nestjs-app # 容器名称
    restart: unless-stopped # 重启策略：除非手动停止，否则总是重启
    ports:
      - '3000:3000' # 端口映射：主机3000 -> 容器3000
    environment:
      # 应用环境变量
      - NODE_ENV=production # 运行环境
      - DATABASE_HOST=mysql # 数据库主机（容器名）
      - DATABASE_PORT=3306 # 数据库端口
      - DATABASE_USERNAME=nestjs # 数据库用户名
      - DATABASE_PASSWORD=${DATABASE_PASSWORD} # 数据库密码（从环境变量读取）
      - DATABASE_NAME=nestjs_db # 数据库名
      - NEST_JWT_SECRET=${NEST_JWT_SECRET} # JWT 密钥（从环境变量读取）
      - NEST_JWT_ACCESS_TOKEN_TTL=1d # JWT 过期时间
      - REDIS_HOST=redis # Redis 主机（容器名）
      - REDIS_PORT=6379 # Redis 端口
    volumes:
      # 数据卷挂载
      - ../../uploads:/app/uploads # 文件上传目录
      - ../../logs:/app/logs # 日志目录
    depends_on:
      # 服务依赖：等待数据库和缓存启动后再启动应用
      - mysql
      - redis
    networks:
      - nestjs-network # 加入自定义网络

  # ---------------------------------------------------------------------------
  # 独立健康检查服务
  # 提供独立的健康检查端点，不影响主应用性能
  # ---------------------------------------------------------------------------
  health-check:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: nestjs-health
    restart: unless-stopped
    ports:
      - '3001:3001' # 健康检查服务端口
    environment:
      - NODE_ENV=production
      - HEALTH_CHECK_PORT=3001 # 健康检查服务端口
    # 覆盖默认启动命令，运行独立健康检查服务
    command: ['dumb-init', 'node', 'standalone-health.js']
    depends_on:
      - app # 依赖主应用服务
    networks:
      - nestjs-network

  # ---------------------------------------------------------------------------
  # MySQL 数据库服务
  # 提供持久化数据存储
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0 # 使用 MySQL 8.0 镜像
    container_name: nestjs-mysql
    restart: unless-stopped
    environment:
      # MySQL 环境变量
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD} # root 用户密码
      - MYSQL_DATABASE=nestjs_db # 创建的数据库名
      - MYSQL_USER=nestjs # 创建的用户名
      - MYSQL_PASSWORD=${DATABASE_PASSWORD} # 用户密码
    volumes:
      # 数据持久化和初始化脚本
      - mysql_data:/var/lib/mysql # 数据持久化
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql # 初始化脚本
    ports:
      - '3306:3306' # 端口映射（可选，用于外部连接）
    # 使用原生密码认证插件（兼容性更好）
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - nestjs-network

  # ---------------------------------------------------------------------------
  # Redis 缓存服务
  # 提供高性能缓存和会话存储
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine # 使用轻量级 Alpine 版本
    container_name: nestjs-redis
    restart: unless-stopped
    # 启用 AOF 持久化，确保数据不丢失
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data # 数据持久化
    ports:
      - '6379:6379' # 端口映射（可选，用于外部连接）
    networks:
      - nestjs-network

  # ---------------------------------------------------------------------------
  # Nginx 反向代理服务
  # 提供负载均衡、SSL 终止、静态文件服务
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine # 使用轻量级 Alpine 版本
    container_name: nestjs-nginx
    restart: unless-stopped
    ports:
      - '80:80' # HTTP 端口
      - '443:443' # HTTPS 端口
    volumes:
      # 配置文件和静态资源挂载
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf # Nginx 配置文件
      - ../nginx/ssl:/etc/nginx/ssl # SSL 证书目录
      - ../../uploads:/var/www/uploads # 静态文件目录
    depends_on:
      - app # 依赖主应用服务
    networks:
      - nestjs-network

# =============================================================================
# 数据卷定义
# 用于数据持久化，容器删除后数据仍然保留
# =============================================================================
volumes:
  mysql_data: # MySQL 数据卷
  redis_data: # Redis 数据卷

# =============================================================================
# 网络定义
# 创建自定义网络，容器间可以通过服务名互相访问
# =============================================================================
networks:
  nestjs-network:
    driver: bridge # 使用桥接网络驱动

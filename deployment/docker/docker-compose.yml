version: '3.8'

services:
  # NestJS应用
  app:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: nestjs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USERNAME=nestjs
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=nestjs_db
      - NEST_JWT_SECRET=${NEST_JWT_SECRET}
      - NEST_JWT_ACCESS_TOKEN_TTL=1d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../../uploads:/app/uploads
      - ../../logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - nestjs-network

  # 健康检查服务（独立运行，不入侵主应用）
  health-check:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: nestjs-health
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - HEALTH_CHECK_PORT=3001
    command: ["dumb-init", "node", "standalone-health.js"]
    depends_on:
      - app
    networks:
      - nestjs-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: nestjs-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=nestjs_db
      - MYSQL_USER=nestjs
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - nestjs-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: nestjs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nestjs-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: nestjs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/ssl:/etc/nginx/ssl
      - ../../uploads:/var/www/uploads
    depends_on:
      - app
    networks:
      - nestjs-network

volumes:
  mysql_data:
  redis_data:

networks:
  nestjs-network:
    driver: bridge
# =============================================================================
# Nginx 反向代理配置文件
# 
# 功能说明：
# - 反向代理：将客户端请求转发到后端 NestJS 应用
# - 负载均衡：支持多个后端服务器（当前配置单服务器）
# - 静态文件服务：直接提供上传文件的访问
# - 健康检查：独立的健康检查服务代理
# - 性能优化：Gzip 压缩、缓存控制、连接优化
# 
# 架构说明：
# 客户端 -> Nginx (80/443) -> NestJS App (3000) / Health Service (3001)
# =============================================================================

# -----------------------------------------------------------------------------
# 事件模块配置
# 控制 Nginx 的连接处理方式
# -----------------------------------------------------------------------------
events {
    # 每个工作进程的最大连接数
    # 总连接数 = worker_processes × worker_connections
    worker_connections 1024;
}

# -----------------------------------------------------------------------------
# HTTP 模块配置
# 处理所有 HTTP 相关的配置
# -----------------------------------------------------------------------------
http {
    # 包含 MIME 类型定义文件
    include       /etc/nginx/mime.types;
    # 默认 MIME 类型（当无法确定文件类型时使用）
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # 日志配置
    # 记录访问日志和错误日志，便于监控和调试
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志：记录所有 HTTP 请求
    access_log /var/log/nginx/access.log main;
    # 错误日志：记录 Nginx 运行错误
    error_log /var/log/nginx/error.log;

    # ---------------------------------------------------------------------------
    # 性能优化配置
    # 提升 Nginx 处理请求的效率
    # ---------------------------------------------------------------------------
    sendfile on;                    # 启用高效文件传输
    tcp_nopush on;                  # 优化网络包发送
    tcp_nodelay on;                 # 禁用 Nagle 算法，减少延迟
    keepalive_timeout 65;           # 保持连接超时时间（秒）
    types_hash_max_size 2048;       # MIME 类型哈希表大小

    # 客户端请求体大小限制（文件上传大小）
    # 100M 支持大文件上传
    client_max_body_size 100M;

    # ---------------------------------------------------------------------------
    # Gzip 压缩配置
    # 压缩响应内容，减少网络传输量，提升加载速度
    # ---------------------------------------------------------------------------
    gzip on;                        # 启用 Gzip 压缩
    gzip_vary on;                   # 添加 Vary: Accept-Encoding 头
    gzip_min_length 1024;           # 最小压缩文件大小（字节）
    gzip_types                      # 需要压缩的 MIME 类型
        text/plain                  # 纯文本
        text/css                    # CSS 样式表
        text/xml                    # XML 文档
        text/javascript             # JavaScript 文件
        application/json            # JSON 数据
        application/javascript      # JavaScript 应用
        application/xml+rss         # RSS XML
        application/atom+xml        # Atom XML
        image/svg+xml;              # SVG 图像

    # ---------------------------------------------------------------------------
    # 上游服务器配置
    # 定义后端服务器组，支持负载均衡
    # ---------------------------------------------------------------------------
    
    # NestJS 主应用服务器组
    upstream nestjs_backend {
        # 后端服务器地址（Docker 容器名:端口）
        # 可以添加多个服务器实现负载均衡
        server app:3000;
        # server app2:3000 weight=2;  # 权重负载均衡示例
        # server app3:3000 backup;    # 备用服务器示例
    }

    # 独立健康检查服务器组
    upstream health_service {
        server health-check:3001;
    }

    # ---------------------------------------------------------------------------
    # 虚拟主机配置
    # 处理具体的 HTTP 请求路由和代理
    # ---------------------------------------------------------------------------
    server {
        # 监听端口和服务器名
        listen 80;                  # HTTP 端口
        server_name localhost;      # 服务器域名（生产环境应改为实际域名）

        # -----------------------------------------------------------------------
        # API 请求代理
        # 将 /api/ 开头的请求转发到 NestJS 后端
        # -----------------------------------------------------------------------
        location /api/ {
            # 代理到后端服务器组
            proxy_pass http://nestjs_backend;
            
            # HTTP 协议版本（支持 WebSocket）
            proxy_http_version 1.1;
            
            # WebSocket 支持的头部设置
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # 传递客户端信息到后端
            proxy_set_header Host $host;                           # 原始主机名
            proxy_set_header X-Real-IP $remote_addr;              # 客户端真实 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 代理链 IP
            proxy_set_header X-Forwarded-Proto $scheme;           # 原始协议（http/https）
            
            # 缓存控制
            proxy_cache_bypass $http_upgrade;
            
            # 超时设置（防止长时间等待）
            proxy_connect_timeout 60s;     # 连接后端超时
            proxy_send_timeout 60s;        # 发送请求超时
            proxy_read_timeout 60s;        # 读取响应超时
        }

        # -----------------------------------------------------------------------
        # 静态文件服务
        # 直接提供上传文件的访问，避免通过应用服务器处理
        # -----------------------------------------------------------------------
        location /uploads/ {
            # 文件系统路径别名
            alias /var/www/uploads/;
            
            # 缓存控制：文件缓存 1 年
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # 不记录静态文件访问日志（减少日志量）
            access_log off;
        }

        # -----------------------------------------------------------------------
        # 健康检查代理
        # 将健康检查请求转发到独立的健康检查服务
        # -----------------------------------------------------------------------
        location /health {
            # 代理到健康检查服务
            proxy_pass http://health_service/health;
            
            # 不记录健康检查访问日志
            access_log off;
        }

        # -----------------------------------------------------------------------
        # 默认路由
        # 处理所有其他请求，转发到 NestJS 应用
        # -----------------------------------------------------------------------
        location / {
            proxy_pass http://nestjs_backend;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS 配置示例（生产环境推荐）
    # 取消注释并配置 SSL 证书后启用
    # ---------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     
    #     # SSL 证书配置
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     # SSL 安全配置
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # 其他 location 配置与 HTTP 相同...
    # }
}